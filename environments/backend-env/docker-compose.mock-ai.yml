version: "3.8"

services:
  mock-ai-service:
    image: node:20-alpine
    container_name: ix-voice-mock-ai
    restart: unless-stopped
    ports:
      - "5000:5000"
    working_dir: /app
    volumes:
      - ../../fixtures:/fixtures
      - ./mock-ai-server.js:/app/mock-ai-server.js
    command: ["node", "mock-ai-server.js"]
