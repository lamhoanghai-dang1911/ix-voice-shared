version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ix-voice-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ix_voice_db
      POSTGRES_USER: ix_voice_user
      POSTGRES_PASSWORD: dev-insecure-password-ix-voice-2026
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
