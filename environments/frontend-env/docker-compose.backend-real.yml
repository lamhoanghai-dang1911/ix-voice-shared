version: "3.8"

services:
  backend-real:
    image: ghcr.io/lamhoanghai-dang1911/ix-voice-backend:latest
    container_name: ix-voice-backend-real
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BACKEND_PORT=8080
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - AI_SERVICE_URL=http://localhost:5000
      - STORAGE_LOCAL_DIR=./data/storage
